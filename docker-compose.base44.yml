# Base44 sandbox development environment.
# Runs the site from the cloned source with Vite's dev server (live reload) on
# host port 3000 — the port the Base44 preview serves.
services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies live in a named volume (not the sandbox disk); install them
    # from the current lockfile/manifest at startup, then exec the dev server.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      # Passed through bare so compose keeps the platform-provided values.
      # BASE44_PREVIEW_MODE=1 only while previewing inside the Base44 sandbox.
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so requests proxied to
      # the container's external hostname are not rejected.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  web_node_modules:
