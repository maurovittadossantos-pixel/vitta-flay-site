# Base44 sandbox environment for Vita Fly Sites.
#
# Runs the app straight from the cloned source with a live-reloading Next.js dev
# server and a local PostgreSQL database.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#   web  -> http://localhost:3000
#
# The web container installs dependencies from the lockfile and applies the
# database schema (both idempotent) before `next dev` starts. They are part of
# the web entrypoint rather than separate one-shot services so that no service
# is ever left in an exited state, which the sandbox health check reports as a
# failure. Re-run them on demand with:
#   docker compose -f docker-compose.base44.yml exec -T web npm ci --no-audit --no-fund
#   docker compose -f docker-compose.base44.yml exec -T web node scripts/migrate.mjs
#
# Secrets the user owns are delivered by the platform to /run/base44/app.env
# (outside the repo) and are listed LAST so they always win over the committed
# development placeholders in ./.env.base44-defaults.
name: vita-fly-sites

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=vita
      - POSTGRES_PASSWORD=vita_dev_password
      - POSTGRES_DB=vita_fly_sites
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vita -d vita_fly_sites']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  web:
    image: node:20
    working_dir: /app
    # npm ci keeps node_modules in sync with package-lock.json after the bind
    # mount is available; migrate.mjs applies db/schema.sql (idempotent) so the
    # app never serves DB errors on a fresh checkout.
    command:
      - sh
      - -ec
      - >-
        npm ci --no-audit --no-fund &&
        node scripts/migrate.mjs &&
        exec npm run dev
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      # Local database credentials are generated here, not user secrets.
      - DATABASE_URL=postgresql://vita:vita_dev_password@db:5432/vita_fly_sites
      # Bind mounts on the sandbox filesystem need polling for hot reload.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the image: probe the app with node's global fetch.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: 'Vita Fly Sites'
      base44.kind: 'web'
      base44.port: '3000'

volumes:
  db_data:
  app_node_modules:
