# Base44 sandbox environment for Vita Fly Sites.
#
# Runs the app straight from the cloned source with a live-reloading Next.js dev
# server, a local PostgreSQL database, and a one-shot migration job.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#   web  -> http://localhost:3000
#
# Secrets the user owns are delivered by the platform to /run/base44/app.env
# (outside the repo) and are listed LAST so they always win over the committed
# development placeholders in ./.env.base44-defaults.
name: vita-fly-sites

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=vita
      - POSTGRES_PASSWORD=vita_dev_password
      - POSTGRES_DB=vita_fly_sites
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vita -d vita_fly_sites']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  # One-shot dependency install from the lockfile, after the bind mount is
  # available. The web app and the migration job wait for it to finish.
  deps:
    image: node:20
    working_dir: /app
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund']
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    restart: 'no'

  web:
    image: node:20
    working_dir: /app
    command: ['sh', '-ec', 'exec npm run dev']
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      # Local database credentials are generated here, not user secrets.
      - DATABASE_URL=postgresql://vita:vita_dev_password@db:5432/vita_fly_sites
      # Bind mounts on the sandbox filesystem need polling for hot reload.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    healthcheck:
      # No curl/wget in the image: probe the app with node's global fetch.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: 'Vita Fly Sites'
      base44.kind: 'web'
      base44.port: '3000'

  # One-shot: applies db/schema.sql (idempotent) and exits.
  migrate:
    image: node:20
    working_dir: /app
    command: ['sh', '-ec', 'node scripts/migrate.mjs']
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://vita:vita_dev_password@db:5432/vita_fly_sites
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  db_data:
  app_node_modules:
